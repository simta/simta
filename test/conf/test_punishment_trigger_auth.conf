receive {
    mode = normal
    punishment = tempfail
    auth {
        authn {
            enabled = true;
            honeypot = true;
        }
    }
}
defaults { red { deliver { bitbucket { enabled = true } } } }
domain "example.com" {
    rule [
        {
            type = accept
            receive { enabled = true }
        }
    ]
}
